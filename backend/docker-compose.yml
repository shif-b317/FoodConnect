services:
  mongo:
    build:
      context: .
      dockerfile: Mongo.Dockerfile
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in backend/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in backend/.env}
      MONGO_INITDB_DATABASE: food_connect
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in backend/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in backend/.env}
    volumes:
      - foodconnect-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/food_connect?authSource=food_connect
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set the frontend HTTPS origin in backend/.env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in backend/.env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in backend/.env}
      EMAIL_FROM: ${EMAIL_FROM:?Set a verified sender address in backend/.env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  foodconnect-mongo:
